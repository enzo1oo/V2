# Test, build, push and deploy grc-tracker (DESIGN section 10).
#
# Runs from the Cloud Build trigger on the repo's main branch (Configuration: "Cloud Build
# configuration file", path cloudbuild.yaml). Set _SHEET_ID (and _SHARED_DRIVE_FOLDER_ID only if
# Config "File storage" = Drive) as substitution variables on the trigger. By hand:
#
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_SHEET_ID=...
#
substitutions:
  # Jakarta: the Gemini API is offered in Indonesia, not in Hong Kong (DESIGN D17).
  _REGION: asia-southeast2
  # The Artifact Registry repo that Cloud Run's GitHub setup created in that region.
  _REPO: cloud-run-source-deploy
  _SERVICE: v2-git
  _RUNTIME_SA: grc-tracker-run
  _SCHEDULER_SA: grc-tracker-scheduler
  _SHEET_ID: ""
  _SHARED_DRIVE_FOLDER_ID: ""
  _GMAIL_TOKEN_SECRET: grc-gmail-refresh-token
  _OAUTH_CLIENT_SECRET: grc-gmail-oauth-client
  _GEMINI_KEY_SECRET: grc-gemini-api-key
  # The service's own URL: the audience every Cloud Scheduler token must carry.
  _SERVICE_URL: https://v2-git-1085688466076.asia-southeast2.run.app
  # The project number (the number in the URL): the audience of Google Chat tokens.
  _CHAT_PROJECT_NUMBER: "1085688466076"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: settings
    name: bash
    args:
      - -c
      - |
        if [ -z "${_SHEET_ID}" ]; then
          echo "Set the _SHEET_ID substitution on the trigger before deploying." >&2
          exit 1
        fi

  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q -r requirements.txt &&
        ruff check . && ruff format --check . &&
        pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com
      - --max-instances=1
      - --min-instances=0
      # CPU stays allocated after a response, so slow Chat requests finish in the background.
      - --no-cpu-throttling
      - --memory=1Gi
      - --timeout=300
      # Chat cannot send an IAM token: the app itself verifies every Scheduler and Chat token.
      - --allow-unauthenticated
      - --set-env-vars=GCP_PROJECT=${PROJECT_ID},GCP_REGION=${_REGION},SHEET_ID=${_SHEET_ID},SHARED_DRIVE_FOLDER_ID=${_SHARED_DRIVE_FOLDER_ID},GMAIL_TOKEN_SECRET=${_GMAIL_TOKEN_SECRET},OAUTH_CLIENT_SECRET=${_OAUTH_CLIENT_SECRET},GEMINI_KEY_SECRET=${_GEMINI_KEY_SECRET},SCHEDULER_SA_EMAIL=${_SCHEDULER_SA}@${PROJECT_ID}.iam.gserviceaccount.com,SERVICE_URL=${_SERVICE_URL},CHAT_PROJECT_NUMBER=${_CHAT_PROJECT_NUMBER},TZ=Asia/Hong_Kong

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${BUILD_ID}
